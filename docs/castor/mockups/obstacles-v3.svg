<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 510" role="img"><title>Três obstáculos leves para a construção da represa</title><rect width="1140" height="510" fill="#F1F8ED"/><g font-family="Segoe UI, sans-serif" fill="#284B43"><text x="42" y="53" font-size="30" font-weight="700">Pequenos desafios, grandes descobertas</text><text x="42" y="86" font-size="17">Observar → experimentar → resolver. Sem pressa e com ajuda quando for preciso.</text></g><g transform="translate(30 116)"><rect width="350" height="315" rx="22" fill="#FFFFFF" stroke="#D0DED2"/><rect x="48" y="75" width="220" height="57" rx="26" fill="#B87439"/><ellipse cx="258" cy="103" rx="19" ry="28" fill="#FFDB8C"/><ellipse cx="258" cy="103" rx="10" ry="17" fill="none" stroke="#BA803D" stroke-width="3"/><path d="M157 70V139" stroke="#FFF9D6" stroke-width="5" stroke-dasharray="7 6"/><path d="M96 88L133 88M82 118L125 118" stroke="#D89952" stroke-width="5" stroke-linecap="round"/><g font-family="Segoe UI, sans-serif" fill="#284B43"><text x="22" y="35" font-size="22" font-weight="700">Galho muito grosso</text><text x="22" y="167" font-size="16">É forte, mas não cabe!</text><rect x="20" y="189" width="310" height="47" rx="16" fill="#FFE69A"/><text x="175" y="219" text-anchor="middle" font-size="18" font-weight="650">Roer no ponto marcado</text><text x="22" y="277" font-size="15">O galho passa a caber no encaixe.</text></g></g><g transform="translate(400 116)"><rect width="350" height="315" rx="22" fill="#FFFFFF" stroke="#D0DED2"/><path d="M48 87Q150 72 265 94L257 129Q151 113 52 130Z" fill="#987153"/><path d="M138 83L124 99L147 106L132 124M211 90L199 108L212 120" fill="none" stroke="#493F37" stroke-width="5"/><circle cx="82" cy="105" r="8" fill="#594837"/><circle cx="231" cy="109" r="6" fill="#594837"/><path d="M66 79Q76 58 88 79M217 85Q229 63 241 86" fill="#BDCD87"/><g font-family="Segoe UI, sans-serif" fill="#284B43"><text x="22" y="35" font-size="22" font-weight="700">Galho estragado</text><text x="22" y="167" font-size="16">Tem fissuras e está mole.</text><rect x="20" y="189" width="310" height="47" rx="16" fill="#FFE69A"/><text x="175" y="219" text-anchor="middle" font-size="18" font-weight="650">Escolher um galho firme</text><text x="22" y="277" font-size="15">Deixar este no chão da floresta.</text></g></g><g transform="translate(770 116)"><rect width="350" height="315" rx="22" fill="#FFFFFF" stroke="#D0DED2"/><path d="M60 120L259 89M161 106L187 64" stroke="#B77B43" stroke-width="16" stroke-linecap="round"/><path d="M52 128Q36 90 72 84Q110 80 123 125Z" fill="#A3B8C4" stroke="#607F91" stroke-width="3"/><path d="M72 67Q95 44 125 55M114 45L128 55L116 65" fill="none" stroke="#278B87" stroke-width="4" stroke-linecap="round"/><g font-family="Segoe UI, sans-serif" fill="#284B43"><text x="22" y="35" font-size="22" font-weight="700">Ramo preso</text><text x="22" y="167" font-size="16">Uma pedrinha prende a ponta.</text><rect x="20" y="189" width="310" height="47" rx="16" fill="#FFE69A"/><text x="175" y="219" text-anchor="middle" font-size="18" font-weight="650">Afastar a pedra e puxar</text><text x="22" y="277" font-size="15">O caminho fica livre para levar.</text></g></g><text x="42" y="473" font-family="Segoe UI, sans-serif" font-size="15" fill="#476258">Proposta de interação · pistas por forma e voz · sem perder materiais · ajuda opcional da coruja</text></svg>